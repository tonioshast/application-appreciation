<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" fill="none">
  <defs>
    <!-- Background glow & gradient for the logo container if displayed transparently -->
    <radialGradient id="iaBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Cyan Gradient for "IA" -->
    <linearGradient id="iaGradientText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00f5ff" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Arc Gradient -->
    <linearGradient id="arcGradientLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#86efac" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="1" />
    </linearGradient>

    <!-- Neon Glow Filter for IA -->
    <filter id="cyanNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starNeonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient light behind IA -->
  <circle cx="585" cy="95" r="110" fill="url(#iaBacklight)" />

  <!-- Arc connecting sparkle over 'a' to 'IA' -->
  <path d="M 92 48 Q 345 -45 595 55" fill="none" stroke="url(#arcGradientLine)" stroke-width="3" stroke-linecap="round" opacity="0.95" />

  <!-- 4-point Sparkle Star -->
  <g transform="translate(92, 48)" filter="url(#starNeonGlow)">
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#67e8f9" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Main Wordmark -->
  <!-- "appréc" -->
  <text x="20" y="135" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Outfit', 'Montserrat', 'Inter', sans-serif" font-size="104" font-weight="600" fill="#f8fafc" letter-spacing="-1">appréc</text>

  <!-- "IA" in glowing electric cyan -->
  <text x="495" y="135" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Outfit', 'Montserrat', 'Inter', sans-serif" font-size="112" font-weight="900" fill="url(#iaGradientText)" filter="url(#cyanNeonGlow)" letter-spacing="1">IA</text>

  <!-- "tion" -->
  <text x="640" y="135" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Outfit', 'Montserrat', 'Inter', sans-serif" font-size="104" font-weight="600" fill="#f8fafc" letter-spacing="-1">tion</text>

  <!-- Subtitle with wide letter spacing -->
  <text x="24" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20.5" font-weight="500" fill="#cbd5e1" letter-spacing="7" opacity="0.92">LOGICIEL DE SYNTHÈSE D'APPRÉCIATIONS POUR ENSEIGNANTS</text>
</svg>
